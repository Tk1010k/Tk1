name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Entpackt deine hochgeladene ZIP-Datei direkt auf dem Server
      - name: Unzip Project Files
        run: |
          if [ -f "TomsTV.zip" ]; then
            unzip TomsTV.zip
            rm TomsTV.zip
          else
            echo "FEHLER: TomsTV.zip wurde im Hauptverzeichnis nicht gefunden!"
            exit 1
          fi

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Sucht die gradlew-Datei im entpackten Inhalt automatisch
      - name: Find Gradle Root and Grant Permissions
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "FEHLER: Keine gradlew-Datei in der ZIP-Datei gefunden!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Gradle-Projekt gefunden in: $GRADLE_DIR"
          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      # Startet den Build im entpackten Ordner
      - name: Run gradle build
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon

      # Sucht nach der erstellten APK und stellt sie bereit
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomsTV-Modernisiert
          path: "**/build/outputs/apk/debug/*.apk"
