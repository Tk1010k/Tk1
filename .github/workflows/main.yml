name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project Files
        run: |
          if [ -f "TomsTV.zip" ]; then
            unzip TomsTV.zip
            rm TomsTV.zip
          else
            echo "FEHLER: TomsTV.zip nicht gefunden!"
            exit 1
          fi

      # Dieser Schritt listet alle entpackten Dateien auf, damit wir den Fehler sehen
      - name: Show Extracted Files
        run: |
          echo "=== Zeige alle entpackten Dateien ==="
          find . -maxdepth 3
