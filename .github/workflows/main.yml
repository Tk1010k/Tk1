name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Sucht die gradlew-Datei automatisch und wechselt in den richtigen Ordner
      - name: Find Gradle Root and Grant Permissions
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "FEHLER: Keine gradlew-Datei im gesamten Repository gefunden!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Gradle-Projekt gefunden in: $GRADLE_DIR"
          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      # Startet den Build im automatisch erkannten Ordner
      - name: Run gradle build
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --no-daemon

      # Sucht nach der erstellten APK und lädt sie hoch
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomsTV-Modernisiert
          path: "**/build/outputs/apk/debug/*.apk"
