name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -qo TomsTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android-Lizenzen annehmen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: gradle -p TomsTV assembleDebug --no-daemon
      - name: APK kopieren
        run: cp TomsTV/app/build/outputs/apk/debug/app-debug.apk TomsTV.apk
      - name: Release mit Versionsnamen veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' TomsTV/app/build.gradle.kts | head -n 1)
          gh release delete "v$VER" --cleanup-tag -y || true
          gh release create "v$VER" TomsTV.apk --title "Tom's TV $VER" --notes "Build"
